<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Ruta - Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #212020; color: #F0F2F5; }
        .m3-card { background-color: #191B1D; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; }
        .m3-primary { background-color: #FEB30F; color: #191B1D; }
        .m3-primary-text { color: #FEB30F; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar Estilo Material Design 3 -->
    <header class="bg-[#191B1D] border-b border-white/10 px-8 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="m3-primary font-bold px-3.5 py-1.5 rounded-xl text-sm shadow">🚍 Mi Ruta Admin</div>
            <h1 class="text-xl font-bold tracking-tight text-white">Centro de Control y Monitoreo</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="adminUserBadge" class="text-xs bg-white/5 border border-white/10 px-3.5 py-1.5 rounded-full text-[#FEB30F] font-semibold">Admin: roy</span>
            <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3.5 py-1.5 rounded-xl text-xs font-bold transition">Cerrar Sesión</button>
        </div>
    </header>

    <!-- Main Container Grid -->
    <main class="flex-1 p-8 max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Sección 1: Conductores (Alta y Telemetría en Vivo) -->
        <section class="m3-card p-6 shadow-xl flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold m3-primary-text flex items-center gap-2">
                    📍 Gestión de Conductores
                </h2>
                <button onclick="loadDrivers()" class="text-xs bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1 rounded-lg text-slate-300 transition">Actualizar</button>
            </div>

            <!-- Formulario para Dar de Alta Conductor -->
            <div class="bg-[#2A2D32] border border-white/5 p-4 rounded-xl mb-4 space-y-2.5">
                <h3 class="text-xs font-bold text-white uppercase tracking-wider">Dar de Alta Conductor</h3>
                <input type="text" id="newDriverUser" placeholder="Usuario (ej. rafa2)" class="w-full bg-[#191B1D] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#FEB30F]">
                <input type="password" id="newDriverPass" placeholder="Contraseña temporal" class="w-full bg-[#191B1D] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#FEB30F]">
                <input type="text" id="newDriverRoute" placeholder="Ruta asignada (ej. Línea L1)" class="w-full bg-[#191B1D] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#FEB30F]">
                <button onclick="registerDriver()" class="w-full m3-primary font-bold py-2 rounded-lg text-xs transition shadow cursor-pointer">Registrar Conductor</button>
            </div>

            <h3 class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Unidades Activas</h3>
            <div id="driversList" class="space-y-3 flex-1 overflow-y-auto max-h-[300px] pr-1">
                <p class="text-slate-400 text-xs italic">Cargando unidades...</p>
            </div>
        </section>

        <!-- Sección 2: Gestión de Usuarios y Roles -->
        <section class="m3-card p-6 shadow-xl flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold m3-primary-text flex items-center gap-2">
                    👥 Usuarios y Roles
                </h2>
                <button onclick="loadUsers()" class="text-xs bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1 rounded-lg text-slate-300 transition">Actualizar</button>
            </div>
            <div id="usersList" class="space-y-3 flex-1 overflow-y-auto max-h-[520px] pr-1">
                <p class="text-slate-400 text-xs italic">Cargando usuarios registrados...</p>
            </div>
        </section>

        <!-- Sección 3: Moderación de Alertas -->
        <section class="m3-card p-6 shadow-xl flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold m3-primary-text flex items-center gap-2">
                    ⚠️ Moderación de Alertas
                </h2>
                <button onclick="loadAlerts()" class="text-xs bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1 rounded-lg text-slate-300 transition">Actualizar</button>
            </div>
            <div id="alertsList" class="space-y-3 flex-1 overflow-y-auto max-h-[520px] pr-1">
                <p class="text-slate-400 text-xs italic">Cargando reportes comunitarios...</p>
            </div>
        </section>

    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "appmiruta-16530"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.registerDriver = async function() {
            const username = document.getElementById("newDriverUser").value.trim();
            const pass = document.getElementById("newDriverPass").value.trim();
            const ruta = document.getElementById("newDriverRoute").value.trim();

            if (!username || !pass || !ruta) {
                alert("Por favor completa todos los campos para dar de alta al conductor.");
                return;
            }

            try {
                // 1. Guardar o actualizar rol en colección users
                await setDoc(doc(db, "users", username), {
                    username: username,
                    role: "conductor",
                    updatedAt: Date.now()
                });

                // 2. Inicializar registro en colección conductores para el mapa en tiempo real
                await setDoc(doc(db, "conductores", username), {
                    id: username,
                    nombre: username,
                    ruta: ruta,
                    lat: 18.9994,
                    lng: -98.2618,
                    activo: true,
                    updatedAt: Date.now()
                });

                alert(`¡Conductor '${username}' dado de alta exitosamente! Ya puede iniciar sesión en la app.`);
                document.getElementById("newDriverUser").value = "";
                document.getElementById("newDriverPass").value = "";
                document.getElementById("newDriverRoute").value = "";
                loadDrivers();
                loadUsers();
            } catch (e) {
                alert(`Error al dar de alta conductor: ${e.message}`);
            }
        };

        window.loadDrivers = async function() {
            const container = document.getElementById("driversList");
            container.innerHTML = `<p class="text-slate-400 text-xs italic">Conectando a Firestore...</p>`;
            try {
                const querySnapshot = await getDocs(collection(db, "conductores"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-slate-400 text-xs">No hay unidades transmitiendo en este momento.</p>`;
                    return;
                }
                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    container.innerHTML += `
                        <div class="bg-[#2A2D32] border border-white/5 p-3.5 rounded-xl flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm text-white">${data.nombre || 'Chofer'}</p>
                                <p class="text-xs text-[#FEB30F]">Ruta: ${data.ruta || 'L1'} • Activo</p>
                                <p class="text-[10px] text-slate-400">Lat: ${data.lat?.toFixed(4)}, Lng: ${data.lng?.toFixed(4)}</p>
                            </div>
                            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = `<p class="text-red-400 text-xs">Error al cargar conductores: ${e.message}</p>`;
            }
        };

        window.loadUsers = async function() {
            const container = document.getElementById("usersList");
            container.innerHTML = `<p class="text-slate-400 text-xs italic">Cargando...</p>`;
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-slate-400 text-xs">No hay usuarios en la nube.</p>`;
                    return;
                }
                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    container.innerHTML += `
                        <div class="bg-[#2A2D32] border border-white/5 p-3.5 rounded-xl flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm text-white">${data.username}</p>
                                <p class="text-xs text-[#FEB30F] uppercase font-semibold">Rol: ${data.role || 'pasajero'}</p>
                            </div>
                            <button onclick="promoteUser('${docSnap.id}', '${data.role === 'conductor' ? 'pasajero' : 'conductor'}')" class="text-xs bg-[#FEB30F]/20 hover:bg-[#FEB30F]/30 text-[#FEB30F] border border-[#FEB30F]/30 px-3 py-1.5 rounded-lg font-bold transition">
                                ${data.role === 'conductor' ? 'Hacer Pasajero' : 'Hacer Conductor'}
                            </button>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = `<p class="text-red-400 text-xs">Error al cargar usuarios: ${e.message}</p>`;
            }
        };

        window.promoteUser = async function(username, newRole) {
            try {
                await updateDoc(doc(db, "users", username), { role: newRole });
                alert(`¡Rol actualizado a '${newRole}' exitosamente!`);
                loadUsers();
            } catch (e) {
                alert(`Error al actualizar rol: ${e.message}`);
            }
        };

        window.loadAlerts = async function() {
            const container = document.getElementById("alertsList");
            container.innerHTML = `<p class="text-slate-400 text-xs italic">Cargando...</p>`;
            try {
                const querySnapshot = await getDocs(collection(db, "incidencias"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-slate-400 text-xs">No hay incidencias reportadas.</p>`;
                    return;
                }
                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    container.innerHTML += `
                        <div class="bg-[#2A2D32] border border-white/5 p-3.5 rounded-xl space-y-2">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-[10px] bg-red-500/20 text-red-400 border border-red-500/20 px-2.5 py-0.5 rounded-md font-bold">${data.tipo || 'Alerta'}</span>
                                    <p class="font-bold text-sm text-white mt-1.5">${data.titulo}</p>
                                </div>
                                <span class="text-xs font-bold ${data.esGlobal ? 'text-emerald-400' : 'text-[#FEB30F]'}">
                                    ${data.esGlobal ? '🟢 Global' : '🟡 Pendiente'} (${data.confirmaciones || 1})
                                </span>
                            </div>
                            <p class="text-xs text-slate-300">${data.descripcion}</p>
                            <div class="flex justify-end space-x-2 pt-1">
                                ${!data.esGlobal ? `<button onclick="verifyAlert('${docSnap.id}')" class="text-xs bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-lg font-bold transition">Aprobar Global</button>` : ''}
                                <button onclick="deleteAlert('${docSnap.id}')" class="text-xs bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-lg font-bold transition">Eliminar</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = `<p class="text-red-400 text-xs">Error al cargar alertas: ${e.message}</p>`;
            }
        };

        window.verifyAlert = async function(id) {
            try {
                await updateDoc(doc(db, "incidencias", id), { esGlobal: true, confirmaciones: 2 });
                alert("¡Alerta promovida a Global con éxito!");
                loadAlerts();
            } catch (e) {
                alert(`Error: ${e.message}`);
            }
        };

        window.deleteAlert = async function(id) {
            try {
                await deleteDoc(doc(db, "incidencias", id));
                alert("Alerta eliminada correctamente.");
                loadAlerts();
            } catch (e) {
                alert(`Error: ${e.message}`);
            }
        };

        window.logout = function() {
            window.location.reload();
        };

        loadDrivers();
        loadUsers();
        loadAlerts();
    </script>
</body>
</html>
